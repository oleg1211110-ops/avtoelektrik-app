<style>
:root{--bg:#E7EBEF;--card:#FFFFFF;--ink:#14202B;--muted:#55636F;--line:#D3DAE0;--accent:#F2A900;--accent-ink:#7A5400;--ok:#1F5E23;--ok-bg:#DDF0DE;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1419;--card:#172029;--ink:#E5EBF0;--muted:#94A3AF;--line:#2A3846;--accent:#F2A900;--accent-ink:#F2C24D;--ok:#9BDCA0;--ok-bg:#1D3320;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.langs{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px}
.langs a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:14px}
.langs a[aria-current]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.cert{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 22px 50px -26px rgba(20,32,43,.55)}
.st{display:flex;height:10px}.st i{flex:1}
.in{margin:14px;border:3px solid var(--accent);border-radius:14px;padding:26px 18px 22px;text-align:center;display:grid;gap:10px;justify-items:center;position:relative}
.in::before,.in::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:var(--bg);top:50%;transform:translateY(-50%)}
.in::before{left:-28px}.in::after{right:-28px}
.logo{width:60px;height:60px;border-radius:50%;background:var(--accent);display:grid;place-items:center}
.kind{margin:0;font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-ink)}
h1{margin:0;font-size:clamp(22px,5vw,30px);line-height:1.2;text-wrap:balance}
.pct{margin:4px 0 0;font-size:clamp(64px,18vw,104px);line-height:1;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
.pct small{font-size:.42em;font-weight:800;vertical-align:.95em;margin-left:2px}
.what{margin:0;max-width:46ch;color:var(--muted)}
.courses{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0 4px;padding:0;list-style:none}
.courses li{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13.5px}
.from{margin:0;font-weight:700}
.code{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.code b{font:800 clamp(22px,6vw,30px)/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;border:2px dashed var(--accent);border-radius:12px;padding:10px 16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.btn.p{background:var(--accent);border-color:var(--accent);color:#1C1400}
.acts{display:grid;gap:10px;margin:18px 0 0}
.how{background:var(--card);border-radius:16px;padding:6px 18px 14px;margin-top:18px;border:1px solid var(--line)}
.how h2{font-size:17px;margin:14px 0 6px}
.how ol{margin:0;padding-left:22px}.how li{margin:6px 0;max-width:62ch}
.fine{color:var(--muted);font-size:13.5px;margin:12px 0 0}
.msg{min-height:1.4em;color:var(--ok);font-weight:600;font-size:14px;margin:0}
.bad{background:var(--card);border-radius:16px;padding:18px;border:1px solid var(--line)}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:24px}
footer a{color:var(--accent-ink)}
</style>
</head>
<body>
<div class="wrap">
  <nav class="langs" aria-label="Язык"><a href="#" data-l="ru">РУС</a><a href="#" data-l="kk">ҚАЗ</a><a href="#" data-l="en">ENG</a></nav>
  <div id="box"></div>
  <footer><span data-t="foot"></span> · <a href="https://avtoelektrik-pro.kz" rel="noopener">avtoelektrik-pro.kz</a></footer>
</div>
<script>
(function(){
  /* Подарочный сертификат «Пригласи друга» (Олег, 26.10.2026): −20 % на любой курс по коду приглашения.
     Ссылку собирает приложение: invite.html?ref=DRUG-XXXXX&n=Имя&lang=ru. Имя необязательно, проверяется фильтром нецензурных слов. */
  var T = {
    ru: {kind: 'Подарочный сертификат', h: 'Приглашение на курсы автоэлектрика Олега', what: 'на любой курс в приложении «АвтоЭлектрик PRO»:', from: 'Дарит: ', code: 'Код приглашения',
      copy: 'Скопировать код', copied: 'Код скопирован', open: 'Открыть курсы со скидкой', apk: 'Скачать приложение для Android', howh: 'Как получить скидку',
      how: ['Откройте курсы кнопкой выше или в приложении: меню → «Курсы автоэлектрика».', 'Пройдите бесплатные уроки и выберите курс.', 'На странице оплаты введите код приглашения — цена станет на 20 % меньше. Напишите Олегу в WhatsApp, оплатите на Kaspi и получите код доступа.'],
      fine: 'Скидка 20 % от полной цены курса — для нового покупателя. Если сейчас действует стартовая цена и она ниже, применяется она. Оплата официально через ИП.',
      courses: ['Для будущих автоэлектриков', 'Ремонт ЭБУ', 'Диагностика сканером', 'Установка автосигнализации'],
      bad: 'В ссылке нет кода приглашения. Попросите друга отправить сертификат ещё раз.', foot: 'Автоэлектрик Олег, Алматы', title: 'Подарок: −20 % на курсы — АвтоЭлектрик PRO'},
    kk: {kind: 'Сыйлық сертификаты', h: 'Олегтің автоэлектрик курстарына шақыру', what: '«АвтоЭлектрик PRO» қосымшасындағы кез келген курсқа:', from: 'Сыйлаушы: ', code: 'Шақыру коды',
      copy: 'Кодты көшіру', copied: 'Код көшірілді', open: 'Курстарды жеңілдікпен ашу', apk: 'Android қосымшасын жүктеу', howh: 'Жеңілдікті қалай алуға болады',
      how: ['Курстарды жоғарыдағы батырмамен немесе қосымшада ашыңыз: мәзір → «Автоэлектрик курстары».', 'Тегін сабақтардан өтіп, курсты таңдаңыз.', 'Төлем бетінде шақыру кодын енгізіңіз — баға 20 %-ға азаяды. Олегке WhatsApp-қа жазып, Kaspi-ге төлеп, кіру кодын алыңыз.'],
      fine: 'Курстың толық бағасынан 20 % жеңілдік — жаңа сатып алушыға. Егер қазір бастапқы баға қолданылса және ол төмен болса, сол қолданылады. Төлем ЖК арқылы ресми.',
      courses: ['Болашақ автоэлектриктерге', 'ЭБУ жөндеу', 'Сканермен диагностика', 'Автосигнализация орнату'],
      bad: 'Сілтемеде шақыру коды жоқ. Досыңыздан сертификатты қайта жіберуін сұраңыз.', foot: 'Автоэлектрик Олег, Алматы', title: 'Сыйлық: курстарға −20 % — АвтоЭлектрик PRO'},
    en: {kind: 'Gift certificate', h: 'An invitation to Oleg’s auto electrics courses', what: 'off any course in the AvtoElektrik PRO app:', from: 'From: ', code: 'Invite code',
      copy: 'Copy code', copied: 'Code copied', open: 'Open the courses with the discount', apk: 'Download the Android app', howh: 'How to get the discount',
      how: ['Open the courses with the button above, or in the app: menu → “Auto electrics courses”.', 'Take the free lessons and pick a course.', 'On the payment page, enter the invite code — the price drops by 20%. Message Oleg on WhatsApp, pay via Kaspi and get your access code.'],
      fine: '20% off the full course price, for a new buyer. If a launch price is running and it’s lower, the launch price applies. Payment is official, through a registered sole proprietorship.',
      courses: ['For future auto electricians', 'ECU repair', 'Scan tool diagnostics', 'Car alarm installation'],
      bad: 'This link has no invite code. Ask your friend to send the certificate again.', foot: 'Auto electrician Oleg, Almaty', title: 'Gift: 20% off courses — AvtoElektrik PRO'}
  };
  // тот же фильтр нецензурных слов, что в приложении (только для имени дарителя)
  var BAD = [/(^|[^а-яәғқңөұүһі])(по|на|ни|за|с|о|от|до|рас|вы|ох|а|у|под|пере|ну)?ху(й|е|я|ю|ит|ил|ев|ен|ек|як)/, /пизд|п[иі]зд/, /(^|[^а-яәғқңөұүһі])(за|вы|до|на|от|отъ|по|про|раз|разъ|у|съ|при|под|подъ|об|объ|из|изъ|въ|вь|пере|недо|долбо|е)?[её]б(а|у|л|н|ош|ок|ук|ищ|ись|ет|ут|ал|ан|ыр|ырь|ёт)/,
    /(^|[^а-яәғқңөұүһі])бл(я|ят|яд)(?!х|шк)/, /(^|[^а-яәғқңөұүһі])(сук(а|и|у)?|муд(ак|ил)|пид(о|а)р|залуп|г(а|о)ндон|шлюх|шалав|ублюд|қотақ|с[іи]гей)/, /(^|[^a-z])(fuck|shit|bitch|cunt|asshole)/];
  var bad = function(s){ s = String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/(.)\1+/g, '$1'); return BAD.some(function(re){ return re.test(s); }); };
  var q = new URLSearchParams(location.search);
  var ref = String(q.get('ref') || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 14);
  if (ref && !/^DRUG-/.test(ref)) ref = 'DRUG-' + ref.replace(/^DRUG/, '');
  var name = String(q.get('n') || '').replace(/[<>"]/g, '').replace(/\s+/g, ' ').trim().slice(0, 30);
  if (bad(name)) name = '';
  var lang = q.get('lang');
  try { if (!T[lang]) lang = localStorage.getItem('ao.lang'); } catch (e) {}
  if (!T[lang]) lang = /^kk/i.test(navigator.language || '') ? 'kk' : /^ru/i.test(navigator.language || '') || !navigator.language ? 'ru' : 'en';
  var APP = 'https://help.avtoelektrik-pro.kz/';
  var esc = function(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); };
  function render(){
    var t = T[lang]; document.documentElement.lang = lang; document.title = t.title;
    document.querySelectorAll('.langs a').forEach(function(a){ if (a.dataset.l === lang) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
    document.querySelector('[data-t="foot"]').textContent = t.foot;
    var box = document.getElementById('box');
    if (!/^DRUG-[A-Z0-9]{5}$/.test(ref)){ box.innerHTML = '<div class="bad"><p>' + esc(t.bad) + '</p><a class="btn p" href="' + APP + '#kursy">' + esc(t.open.replace(/ со скидкой| жеңілдікпен| with the discount/, '')) + '</a></div>'; return; }
    var open = APP + '?ref=' + encodeURIComponent(ref) + '#kursy';
    box.innerHTML = '<div class="cert"><div class="st"><i style="background:#8B5A2B"></i><i style="background:#D32F2F"></i><i style="background:#1E5BD8"></i><i style="background:#F2C200"></i><i style="background:#E4E8EC"></i><i style="background:#2E9E4F"></i><i style="background:#F07F12"></i></div>' +
      '<div class="in"><div class="logo"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.2" stroke="#1C1400" stroke-width="2.6"/><path d="M13.2 5.6 8.6 13h3.1l-1 5.4 4.7-7.6h-3.1z" fill="#1C1400"/></svg></div>' +
      '<p class="kind">' + esc(t.kind) + '</p><h1>' + esc(t.h) + '</h1><p class="pct">−20<small>%</small></p><p class="what">' + esc(t.what) + '</p>' +
      '<ul class="courses">' + t.courses.map(function(c){ return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>' +
      (name ? '<p class="from">' + esc(t.from) + esc(name) + '</p>' : '') +
      '<div class="code"><span>' + esc(t.code) + '</span><b>' + esc(ref) + '</b></div>' +
      '<button type="button" class="btn" id="copy">' + esc(t.copy) + '</button><p class="msg" id="msg" role="status"></p></div></div>' +
      '<div class="acts"><a class="btn p" href="' + esc(open) + '">' + esc(t.open) + '</a><a class="btn" href="' + APP + 'app/avtoelektrik-pro.apk">' + esc(t.apk) + '</a></div>' +
      '<div class="how"><h2>' + esc(t.howh) + '</h2><ol>' + t.how.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ol><p class="fine">' + esc(t.fine) + '</p></div>';
    document.getElementById('copy').addEventListener('click', function(){
      var m = document.getElementById('msg');
      try { navigator.clipboard.writeText(ref).then(function(){ m.textContent = t.copied; }, function(){ m.textContent = ref; }); } catch (e) { m.textContent = ref; }
    });
    try { localStorage.setItem('ao.ref', ref); } catch (e) {}
  }
  document.querySelectorAll('.langs a').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); lang = a.dataset.l; render(); }); });
  render();
})();
</script>
