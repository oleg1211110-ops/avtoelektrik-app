# Подключает свой адрес help.avtoelektrik-pro.kz к GitHub Pages (запуск вручную).
# Запись CNAME help → oleg1211110-ops.github.io уже добавлена в DNS на hoster.kz.
name: Домен

on:
  workflow_dispatch:
    inputs:
      https:
        description: "Включить обязательный HTTPS (после выпуска сертификата)"
        type: boolean
        default: false

permissions:
  pages: write

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - name: Адрес
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.https }}" = "true" ]; then
            out=$(gh api -X PUT "repos/${{ github.repository }}/pages" -F https_enforced=true 2>&1) || { echo "::error::$(echo "$out" | tr '\n' ' ')"; exit 1; }
          else
            out=$(gh api -X PUT "repos/${{ github.repository }}/pages" -f cname=help.avtoelektrik-pro.kz 2>&1) || { echo "::error::$(echo "$out" | tr '\n' ' ')"; exit 1; }
          fi
          info=$(gh api "repos/${{ github.repository }}/pages" -q '"cname=" + (.cname // "") + " https=" + (.https_enforced|tostring) + " status=" + (.status // "")' 2>&1)
          echo "::notice::$info"
