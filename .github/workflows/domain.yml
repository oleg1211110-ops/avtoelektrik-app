# Подключает свой адрес help.avtoelektrik-pro.kz к GitHub Pages (запуск вручную).
# Запись CNAME help → oleg1211110-ops.github.io уже добавлена в DNS на hoster.kz.
name: Домен

on:
  workflow_dispatch:
    inputs:
      https:
        description: "Включить обязательный HTTPS (после выпуска сертификата)"
        type: boolean
        default: false

permissions:
  pages: write

jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - name: Адрес
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          if [ "${{ inputs.https }}" = "true" ]; then
            gh api -X PUT "repos/${{ github.repository }}/pages" -F https_enforced=true
          else
            gh api -X PUT "repos/${{ github.repository }}/pages" -f cname=help.avtoelektrik-pro.kz
          fi
          gh api "repos/${{ github.repository }}/pages"
          gh api "repos/${{ github.repository }}/pages/health" || true
