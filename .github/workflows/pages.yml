# Публикует папку www/ на https://help.avtoelektrik-pro.kz/ (свой адрес; oleg1211110-ops.github.io/avtoelektrik-app/ переадресует сюда)
# (страница приложения, окно-консультант widget.js, данные data/db.json)
name: Сайт

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # GitHub Pages — не больше 1 ГБ, а с FLAC и MP3 320 сайт ~2 ГБ: обновления перестали выходить (07.11.2026). Высокое качество
      # временно не выкладываем (Олег: «да, пока сделаем») — файлы остаются в репозитории, на сайт уходят только обычные MP3.
      # Вернуть — когда звук баллад будет в Cloudflare R2 (tools/skazaniya_r2.py в репозитории приложения).
      - name: Без FLAC и MP3 320 (временно)
        run: |
          find www/skazaniya/audio \( -name '*.flac' -o -name '*-320.mp3' \) -delete
          du -sh www
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # сайт с песнями ~1,9 ГБ: перенос файлов на GitHub дольше 10 минут (по умолчанию) — даём 30 (06.11.2026)
          timeout: 1800000
